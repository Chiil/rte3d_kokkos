# Settings for a user case, read by run_case.py as CASE.toml. This file is the only
# place a setting lives -- the runner takes the case name and nothing else -- so a case
# is reproducible from it alone. Everything here is optional; the values shown are the
# defaults.

[switches]
longwave = true
shortwave = true

# Read lwp, iwp, rel and dei from the input and include clouds. The cloud
# coefficient files must be band-resolved -bnd ones.
cloud-optics = false

# Delta-scale the shortwave cloud properties before adding them, as the reference
# driver does. No effect on the longwave, where clouds are absorption only.
delta-cloud = true

# Also write the fluxes resolved by band, as lw_bnd_flux_* and sw_bnd_flux_*.
output-bnd-fluxes = false

[shortwave]
# Which shortwave solver to run; both is allowed, and is how to see what the third
# dimension is worth. They share the gas optics and the cloud properties.

# The plane-parallel two-stream solver, a flux profile per column.
plane-parallel = true

# The three-dimensional Monte Carlo ray tracer. Needs the Cartesian grid -- x, xh, y,
# yh, z, zh -- in the input file; cases/make_input.py writes it. Its output is
# rt_flux_sfc_dir, rt_flux_sfc_dif, rt_flux_sfc_up and rt_flux_tod_dn / rt_flux_tod_up
# as (y, x), and rt_flux_abs_dir / rt_flux_abs_dif, the absorbed flux per unit height,
# as (z, y, x).
raytracing = false

# Photons per column per g-point. The noise falls as one over its square root.
photons-per-pixel = 256

# Trace without horizontal transport, which makes the tracer an expensive but exact
# column solver. Useful for telling the two-stream's error from the third dimension's.
independent-column = false

# Divide the photon budget over the g-points as the solar irradiance to this power
# rather than equally, the total unchanged. Zero is equal shares. One spends in
# proportion to the flux each g-point carries, which is what minimizes the noise of
# the broadband boundary fluxes per photon -- but photons in the bright visible
# g-points scatter longer before they die, so each of them also costs more. Measured
# on two real fields, one is worth about 1.5x at equal boundary-flux noise and is a
# loss on the absorption field; 0.5 is the better compromise. See
# doc/raytracer_base_optimizations.md.
spectral-photons = 0.0

[longwave]
# The same two solvers for the longwave, chosen the same way.
plane-parallel = true
raytracing = false
photons-per-pixel = 256
independent-column = false

# Let clouds deflect a photon and not only absorb and emit it. Follows lw-scattering
# in rte-rrtmgp-cpp's ini files.
scattering = false

# Skip the g-points whose gas is opaque within a grid cell and solve those
# plane-parallel instead: a photon cannot cross a cell before it is absorbed, so there
# is no horizontal transport to resolve. The threshold is the mean free path as a
# fraction of the cell size; 0 traces the whole spectrum, 1 is what rte-rrtmgp-cpp
# uses. Ray tracer only.
min-mfp-grid-ratio = 0.0

[files]
# Bare names are looked up in extern/rrtmgp-data; anything with a separator in it is
# taken as a path.
gas-lw = "rrtmgp-gas-lw-g256.nc"
gas-sw = "rrtmgp-gas-sw-g224.nc"
cloud-lw = "rrtmgp-clouds-lw-bnd.nc"
cloud-sw = "rrtmgp-clouds-sw-bnd.nc"

# Ice roughness type, 0-based. The reference defaults to the smoothest; the all-sky
# example uses 1.
icergh = 0

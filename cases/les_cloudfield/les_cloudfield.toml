# The example LES cloud field of rte-rrtmgp-cpp: a 2560 x 2560 x 4000 m RICO
# cumulus field at 20 m resolution, 128 x 128 x 200 ray-tracing cells, cloud in
# 0.8 percent of them. Input is the same test_input.nc that case reads.
#
# Kept out of git: the input file is 26 MB and lives in the reference tree.

[switches]
longwave = true
shortwave = true
cloud-optics = true
delta-cloud = false     # as in the reference case's test.ini

# The k-distributions the reference case's test.ini reads, so that a run here and a
# run of rte-rrtmgp-cpp's test_rte_rrtmgp_rt cover the same g-points: 112 shortwave,
# 128 longwave. Both files are rte3d's own copies, byte for byte the reference's.
[files]
gas-sw = "rrtmgp-gas-sw-g112.nc"
gas-lw = "rrtmgp-gas-lw-g128.nc"

[shortwave]
# Both transports, on the same gas optics and the same clouds. The two-stream one is
# not part of the comparison against rte-rrtmgp-cpp below -- that is about the traced
# fluxes alone -- but it costs under a second here and it is what the third dimension
# has to be measured against. plot_solvers.py draws the two side by side.
plane-parallel = true
raytracing = true
photons-per-pixel = 256

# Verified against rte-rrtmgp-cpp's own test_rte_rrtmgp_rt on this field, same 112
# g-points, same sun: surface direct, surface diffuse, surface up and top-of-domain
# up all agree to better than 0.1 percent, and the absorption profile agrees to
# 0.00 percent in the mean over the 200 shared cells. rte3d reports one cell more
# than the reference: index 200 holds the layers above the box, lumped.
#
# To reproduce, set sza and azi explicitly in the reference's test.ini -- sza = 30,
# azi = 108.8975, the input file's own sun. Its documented fallback, "mu0 from input
# file is used if sza < 0", did not do that in the build tested here: the whole solve
# came out as though mu0 were 1, which transmits 15 percent more direct beam and
# makes the reference look both brighter and faster than it is.
#
# The stored test_output.nc in the reference tree is a third configuration again --
# test.ini ships sza = 45 -- so it is not a like-for-like check either.

[longwave]
# The same pair in the longwave, for the same reason.
plane-parallel = true
raytracing = true
scattering = false      # lw-scattering = false in the reference's test.ini
# The reference counts longwave photons as 2**samples for the whole domain, not per
# pixel as it does in the shortwave -- samples = 22 there. 2**22 over 128*128 columns
# is 256 per pixel exactly, so the two budgets match to the photon.
photons-per-pixel = 256

# Skip the g-points whose gas is opaque within a grid cell and solve those
# plane-parallel: a photon cannot cross a cell before it is absorbed, so there is no
# horizontal transport to resolve and tracing them buys nothing but noise. On this
# field 62 of the 128 g-points are traced and 66 are not.
#
# 1.0 is what the reference actually uses here, though its test.ini does not say so:
# the ini writes min_mf_grid_ratio where the code reads min_mfp_grid_ratio, so the
# 0.0 in it is ignored and the built-in default of 1.0 applies. Match it, or the two
# runs differ over half the spectrum -- the reference's fluxes then carry a smooth
# plane-parallel contribution for 66 g-points and a fully traced run does not, which
# shows up as a completely different pattern and six times less scatter.
#
# Setting this to 0 traces the whole spectrum. That costs about 0.3 percent on the
# boundary fluxes here, which is the size of the approximation.
min-mfp-grid-ratio = 1.0

# Leave the 132 layers above the box outside it, as the reference does, rather than
# lump them into the box's top cell. The lumped cell carries the right optical depth
# but one temperature and the box's own 20 m, so it sends 199.6 W/m2 down into the box
# where the air it stands in for sends 227.9 -- and the cells just beneath it then cool
# far too hard, 33 K/day against 0.3 in the topmost one, dying away downward and gone
# in the noise by 3.5 km. Left outside, the box is the 200 resolved cells and the air
# above enters as the downward flux a plane-parallel solve of the full column leaves at
# its top: 227.8 against that solve's 227.9, and the cooling profile follows the
# two-stream all the way up.
#
# The tracer then knows nothing of what is above the box, so rt_lw_flux_toa_up is
# rt_lw_flux_tod_up and not what reaches space; the plane-parallel solve beside it
# still has that. It costs about 10 percent of the trace, one plane-parallel solve of
# the full column per g-point.
lump-above = false

# Verified against rte-rrtmgp-cpp's test_rte_rrtmgp_rt on this field, same 128
# g-points, same photon budget, with the atmosphere truncated to the 200 resolved
# layers so that both codes see the same air:
#
#   surface up    0.003 percent   top-of-domain up   0.003 percent
#   surface down  0.18 percent    column-integrated net  0.24 percent
#
# with the same 62 of 128 g-points traced, where the cooling profile correlates at
# 0.9989 over the 200 cells.
#
# Tracing the whole spectrum instead (min-mfp-grid-ratio = 0) makes the profile a much
# weaker check: correlation 0.974 over the 200 cells, but carried by the topmost cell
# alone, which cools at 3.4 W/m3 against a median of 0.05 -- drop the top twenty and it
# is 0.07, because at that budget the per-cell rate is not converged in either code.
# What is converged there is the integral: running column sums agree to 1 to 2 percent
# from the surface up and to 0.08 over the whole column.
#
# The field is liquid-only, thin -- 1.29 percent of cells carry cloud, 19 percent of
# columns -- so the cloud effect is modest but present in both, and agrees within the
# noise on the difference: surface down +9.22 against +8.91 W/m2, column net -6.41
# against -6.51, top-of-domain up -2.64 against -2.32.
#
# rte3d is 2.1 times faster: 1104 ms against 2350.
#
# Those numbers were taken with the atmosphere truncated by hand to the 200 resolved
# layers, which is what lump-above = false now does from the settings file. With the
# layers lumped instead -- lump-above = true, which was the only behaviour then -- the
# air above absorbs 54 W/m2 of the upwelling flux before it reaches space, so the
# tracer's top-of-domain up is 321 rather than 374 W/m2 and the reference's is 374,
# since it discards those layers. Neither was a porting error; see the note in
# include/raytracer_lw.h.

# The example LES cloud field of rte-rrtmgp-cpp: a 2560 x 2560 x 4000 m RICO
# cumulus field at 20 m resolution, 128 x 128 x 200 ray-tracing cells, cloud in
# 0.8 percent of them. Input is the same test_input.nc that case reads.
#
# Kept out of git: the input file is 26 MB and lives in the reference tree.

[switches]
longwave = true
shortwave = true
cloud-optics = true
delta-cloud = false     # as in the reference case's test.ini

# The k-distributions the reference case's test.ini reads, so that a run here and a
# run of rte-rrtmgp-cpp's test_rte_rrtmgp_rt cover the same g-points: 112 shortwave,
# 128 longwave. Both files are rte3d's own copies, byte for byte the reference's.
[files]
gas-sw = "rrtmgp-gas-sw-g112.nc"
gas-lw = "rrtmgp-gas-lw-g128.nc"

[shortwave]
plane-parallel = false
raytracing = true
photons-per-pixel = 256

# Verified against rte-rrtmgp-cpp's own test_rte_rrtmgp_rt on this field, same 112
# g-points, same sun: surface direct, surface diffuse, surface up and top-of-domain
# up all agree to better than 0.1 percent, and the absorption profile agrees to
# 0.00 percent in the mean over the 200 shared cells. rte3d reports one cell more
# than the reference: index 200 holds the layers above the box, lumped.
#
# To reproduce, set sza and azi explicitly in the reference's test.ini -- sza = 30,
# azi = 108.8975, the input file's own sun. Its documented fallback, "mu0 from input
# file is used if sza < 0", did not do that in the build tested here: the whole solve
# came out as though mu0 were 1, which transmits 15 percent more direct beam and
# makes the reference look both brighter and faster than it is.
#
# The stored test_output.nc in the reference tree is a third configuration again --
# test.ini ships sza = 45 -- so it is not a like-for-like check either.

[longwave]
plane-parallel = false
raytracing = true
scattering = false      # lw-scattering = false in the reference's test.ini
# The reference counts longwave photons as 2**samples for the whole domain, not per
# pixel as it does in the shortwave -- samples = 22 there. 2**22 over 128*128 columns
# is 256 per pixel exactly, so the two budgets match to the photon.
photons-per-pixel = 256

# Verified against rte-rrtmgp-cpp's test_rte_rrtmgp_rt on this field, same 128
# g-points, same photon budget, with the atmosphere truncated to the 200 resolved
# layers so that both codes see the same air:
#
#   surface up    0.01 percent    top-of-domain up   0.16 percent
#   surface down  0.23 percent    column-integrated net  0.08 percent
#
# at 2**25 photons. The cooling *profile* is a weaker check than those numbers look:
# it correlates at 0.974 over the 200 cells, but that is carried by the topmost cell
# alone, which cools at 3.4 W/m3 against a median of 0.05 -- drop the top twenty and
# the correlation is 0.07, because at this budget the per-cell rate is not converged in
# either code. Both scatter by a tenth of a W/m3 cell to cell, sign flips and all, in a
# profile that should be smooth. What is converged is the integral: running column
# sums agree to 1 to 2 percent from the surface up, and to 0.08 over the whole column.
#
# The field is liquid-only, thin -- 1.29 percent of cells carry cloud, 19 percent of
# columns -- so the cloud effect is modest but present in both, and agrees within the
# noise on the difference: surface down +9.22 against +8.91 W/m2, column net -6.41
# against -6.51, top-of-domain up -2.64 against -2.32.
#
# rte3d is 2.5 times faster at that photon count, 2.1 times at 2**22.
#
# Run as it stands, without truncating, rte3d lumps the 132 layers above the box into
# its top cell and the reference discards them. That is a real difference and a large
# one -- the air above absorbs 54 W/m2 of the upwelling flux before it reaches space,
# so top-of-domain up is 321 rather than 374 W/m2. Neither is a porting error; see the
# note in include/raytracer_lw.h.

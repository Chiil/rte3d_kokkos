[pytest]
testpaths = tests

# Both filters below are for third-party warnings that were traced to their source and
# verified harmless. Neither is suppressed on the assumption that it is fine.
filterwarnings =
    error

    # netCDF4's Cython extension is built against the numpy 1.x C headers and reports
    # a size change under numpy 2.x. Only the documented numpy API is used, and the
    # values it returns were checked against ncdump, which goes through the netCDF C
    # library directly: kmajor and press_ref come back bit-identical. See
    # test_netcdf_reads_match_ncdump, which keeps that guarantee under test.
    ignore:numpy.ndarray size changed:RuntimeWarning

    # The RFMIP reference flux files carry _FillValue as float32 while xarray also
    # infers a float64 one, so it warns that it will decode both to NaN. No value in
    # any of the four files actually equals the fill value, so nothing is masked;
    # test_reference_fluxes_have_no_missing_values checks that.
    ignore:variable .* has multiple fill values

    # netCDF4 1.7.4 assigns to ndarray.shape when writing any variable of rank two or
    # more, which numpy 2.5 deprecates. It is a reshape of an array netCDF4 owns, in
    # its Cython __setitem__, with no effect on what lands in the file: the case tests
    # write an input file and read it back, and the values compare bit for bit.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
